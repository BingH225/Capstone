[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartstress-capstone"
version = "2.0.0"
description = "SmartStress physiological and MindCare reliability modules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
train = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3,<5",
  "peft>=0.14,<1",
  "trackio>=0.3,<1",
  "transformers>=4.48,<6",
  "trl>=0.15,<1",
]

[project.scripts]
smartstress-reliability = "smartstress_policy_reliability.cli:main"
smartstress-mindcare = "smartstress_mindcare.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
