name: Capstone CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements/validated-constraints.txt -e ".[test]"
      - run: python scripts/check_checkout.py
      - run: python -m pytest -q --ignore=tests/agent
      - run: python scripts/offline_smoke.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements/validated-constraints.txt -e ".[backend,research,test]"
      - run: python -m pytest -q
      - run: python scripts/offline_smoke.py --backend
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
