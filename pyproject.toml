[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartstress-capstone"
version = "2.1.0"
description = "SmartStress capstone monorepo: reliability, agents, API and research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27,<1"]
backend = [
  "setuptools>=69,<81",  # HeartPy imports pkg_resources at runtime.
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langchain-core>=0.3,<2",
  "google-genai>=1,<2",
  "google-generativeai>=0.8,<1",
  "mysql-connector-python>=9,<10",
  "python-dotenv>=1,<2",
  "torch>=2.2,<3",
  "scipy>=1.10,<2",
  "heartpy>=1.2.6,<2",
  "shap>=0.44,<1",
]
research = [
  "setuptools>=69,<81",
  "pandas>=2,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "torch>=2.2,<3",
  "scipy>=1.10,<2",
  "heartpy>=1.2.6,<2",
  "python-dotenv>=1,<2",
  "tqdm>=4.66,<5",
  "ipython>=8,<10",
  "shap>=0.44,<1",
]
train = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3,<5",
  "peft>=0.14,<1",
  "trackio>=0.3,<1",
  "transformers>=4.48,<6",
  "trl>=0.15,<1",
]
experiment = [
  "matplotlib>=3.8,<4",
  "torch>=2.6,<3",
]

[project.scripts]
smartstress-reliability = "smartstress_policy_reliability.cli:main"
smartstress-mindcare = "smartstress_mindcare.cli:main"
smartstress-server = "smartstress_langgraph.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smartstress_langgraph.physio" = ["artifacts/*.json", "artifacts/*.pth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
